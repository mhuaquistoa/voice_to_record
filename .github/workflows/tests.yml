name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install num2words pyyaml python-dotenv pytest
      - run: pytest -q tests
